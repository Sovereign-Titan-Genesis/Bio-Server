name: Bio-Server CI/CD

on:
  push:
    branches:
      - main

jobs:
  install-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

  build-server:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v3
      - name: Run build checks
        run: python setup.py install

  test-liveness:
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - uses: actions/checkout@v3
      - name: Run liveness detection tests
        run: pytest tests/liveness/

  test-crypto:
    runs-on: ubuntu-latest
    needs: test-liveness
    steps:
      - uses: actions/checkout@v3
      - name: Run cryptographic proof tests
        run: pytest tests/crypto/

  deploy-server:
    runs-on: ubuntu-latest
    needs: test-crypto
    steps:
      - uses: actions/checkout@v3
      - name: Deploy Bio-Server
        run: |
          docker build -t bio-server .
          docker run -d -p 8080:8080 bio-server
          
